<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <rect width="1200" height="400" fill="#F6F2EC"/>
  <svg x="60" y="60" width="280" height="280" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2A3D"/>
      <stop offset="1" stop-color="#17151F"/>
    </linearGradient>
    <radialGradient id="fur" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.75" stop-color="#F6F3EE"/>
      <stop offset="1" stop-color="#DCD6CE"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.5" cy="0.62" r="0.6">
      <stop offset="0" stop-color="#E8C46A"/>
      <stop offset="1" stop-color="#9C7A33"/>
    </radialGradient>
    <linearGradient id="nose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7B9C1"/>
      <stop offset="1" stop-color="#E48F9C"/>
    </linearGradient>
  </defs>

  <!-- app tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- ears -->
  <path d="M112 236 L150 70 Q156 58 168 66 L246 150 Z" fill="url(#fur)" stroke="#DCD6CE" stroke-width="2" stroke-linejoin="round"/>
  <path d="M400 236 L362 70 Q356 58 344 66 L266 150 Z" fill="url(#fur)" stroke="#DCD6CE" stroke-width="2" stroke-linejoin="round"/>
  <path d="M146 196 L160 100 L214 156 Z" fill="#F2B5BE" stroke-linejoin="round"/>
  <path d="M366 196 L352 100 L298 156 Z" fill="#F2B5BE" stroke-linejoin="round"/>

  <!-- head: wide at the jowls, seen from below -->
  <path d="M256 128
           C352 128 430 196 432 290
           C434 380 356 446 256 446
           C156 446 78 380 80 290
           C82 196 160 128 256 128 Z" fill="url(#fur)"/>

  <!-- eyes, round and looking up -->
  <g>
    <ellipse cx="180" cy="212" rx="38" ry="30" fill="#1C1A20"/>
    <ellipse cx="180" cy="214" rx="31" ry="24" fill="url(#iris)"/>
    <ellipse cx="180" cy="205" rx="22" ry="17" fill="#141218"/>
    <circle cx="170" cy="198" r="6" fill="#FFFFFF" opacity="0.9"/>
  </g>
  <g>
    <ellipse cx="332" cy="212" rx="38" ry="30" fill="#1C1A20"/>
    <ellipse cx="332" cy="214" rx="31" ry="24" fill="url(#iris)"/>
    <ellipse cx="332" cy="205" rx="22" ry="17" fill="#141218"/>
    <circle cx="322" cy="198" r="6" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- nose, big and up front -->
  <path d="M204 262 Q256 228 308 262 Q318 282 296 302 L270 324 Q256 334 242 324 L216 302 Q194 282 204 262 Z" fill="url(#nose)"/>
  <ellipse cx="234" cy="288" rx="12" ry="7" fill="#C96F7E" transform="rotate(-20 234 288)"/>
  <ellipse cx="278" cy="288" rx="12" ry="7" fill="#C96F7E" transform="rotate(20 278 288)"/>
  <ellipse cx="246" cy="256" rx="18" ry="6" fill="#FFFFFF" opacity="0.35"/>

  <!-- mouth -->
  <path d="M256 330 L256 344" stroke="#B9A9A4" stroke-width="4" stroke-linecap="round"/>
  <path d="M232 344 Q256 360 280 344" fill="none" stroke="#B9A9A4" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="256" cy="352" rx="10" ry="4" fill="#4A3436"/>

  <!-- black goatee, like the photo -->
  <path d="M212 384 Q256 370 300 384 Q298 420 256 438 Q214 420 212 384 Z" fill="#1B1A20"/>

  <!-- whiskers -->
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M150 318 Q100 300 46 296"/>
    <path d="M150 334 Q98 330 44 340"/>
    <path d="M154 350 Q104 360 58 384"/>
    <path d="M362 318 Q412 300 466 296"/>
    <path d="M362 334 Q414 330 468 340"/>
    <path d="M358 350 Q408 360 454 384"/>
  </g>
</svg>
  <text x="400" y="250" font-family="Segoe UI Variable Display, Segoe UI, Arial Rounded MT Bold, sans-serif" font-weight="800" font-size="190" letter-spacing="6" fill="#1E1B27">BUKU</text>
  <text x="408" y="312" font-family="Segoe UI, sans-serif" font-weight="500" font-size="36" fill="#8A8294">a little notch with a cat inside</text>
</svg>
